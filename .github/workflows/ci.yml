name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verification du code
        run: go vet ./...

      - name: Tests
        run: go test ./...

      - name: Compilation
        run: go build -o /tmp/forum .
